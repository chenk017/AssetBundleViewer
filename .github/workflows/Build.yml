name: Build Android APK 🚀

on:
  push:
    branches:
      - main  # Otomatis berjalan setiap ada push ke branch main
  workflow_dispatch: # Tombol manual di tab Actions GitHub

jobs:
  buildAndroid:
    name: Build for Android 📱
    runs-on: ubuntu-latest
    steps:
      # 1. Mengambil kode dari repositori
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Proses Build Unity (Otomatis membaca secret UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD)
      - name: Build Unity Project
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidAppBundle: false  # Ubah ke true jika ingin format .aab untuk Google Play

      # 3. Menyimpan hasil file APK agar bisa di-download
      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: build-android-apk
          path: build/Android/*.apk
