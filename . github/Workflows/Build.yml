name: Build Android APK 🚀

on:
  push:
    branches:
      - main  # Otomatis berjalan setiap ada push ke branch main
  workflow_dispatch: # Memungkinkan kamu menjalankan manual dari tab Actions di GitHub

jobs:
  buildAndroid:
    name: Build for Android 📱
    runs-on: ubuntu-latest
    steps:
      # 1. Mengambil kode dari repositori
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Mengaktifkan Unity Editor di Cloud menggunakan file .ulf (.github secrets)
      - name: Unity License Activation
        uses: game-ci/unity-request-activation-file@v2
        id: activation
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # 3. Proses Build APK Android menggunakan Game-CI Builder
      - name: Build Unity Project
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          androidAppBundle: false  # Set 'true' jika ingin format .aab untuk Play Store, 'false' untuk .apk biasa

      # 4. Menyimpan hasil file APK agar bisa di-download setelah build selesai
      - name: Upload APK Result
        uses: actions/upload-artifact@v4
        with:
          name: build-android-apk
          path: build/Android/*.apk
